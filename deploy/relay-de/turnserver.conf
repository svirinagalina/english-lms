# The relay in Germany for calls whose incoming sound gets lost on the way
# from srv3 (server/src/turn.js). Plain UDP TURN, and it relays only to the
# media server on srv3 — nobody can use it to reach anything else.
listening-port=3478
no-tcp
no-tls
no-dtls
fingerprint
use-auth-secret
static-auth-secret=__SECRET__
realm=relay.advent-academy.online
min-port=49160
max-port=49400
no-tcp-relay
no-cli
no-multicast-peers
no-loopback-peers
denied-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
allowed-peer-ip=__MEDIA_SERVER_IP__
user-quota=12
total-quota=300
stale-nonce=600
simple-log
syslog
